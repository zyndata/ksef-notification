name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is inconvenient or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: >
        The integration may only use libraries shipped with HA core, must stay inside KSeF's
        request limits (see docs/KSEF_API.md), and must never write invoice content to disk.
      options:
        - label: I have read the constraints above and believe the request fits them.
